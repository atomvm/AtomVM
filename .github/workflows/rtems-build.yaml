name: RTEMS Build

on:
  push:
    paths:
      - '.github/workflows/rtems-build.yaml'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'src/platforms/rtems/**'
      - 'src/libAtomVM/**'
      - 'libs/**'
  pull_request:
    paths:
      - '.github/workflows/rtems-build.yaml'
      - 'CMakeLists.txt'
      - 'CMakeModules/**'
      - 'src/platforms/rtems/**'
      - 'src/libAtomVM/**'
      - 'libs/**'
  workflow_dispatch:
    inputs:
      riscv_toolchain_image:
        description: 'RTEMS 7 RISC-V toolchain image to use instead of building the toolchain (empty builds it)'
        type: string
        default: ''
      arm_toolchain_image:
        description: 'RTEMS 6 ARM toolchain image to use instead of building the toolchain (empty builds it)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  RTEMS_VERSION: "6"
  RTEMS_RELEASE: "6"
  RTEMS_PREFIX: /home/runner/rtems/6
  # The toolchain images published by the RTEMS Toolchain Images workflow can
  # be used instead of building the toolchains here, which keeps the CI off
  # the RTEMS servers. Set the repository variables, or the inputs above for
  # a single run, to an image reference to use it; leave them empty to build
  # the toolchain from the pinned sources.
  RTEMS_RISCV_TOOLCHAIN_IMAGE: ${{ inputs.riscv_toolchain_image || vars.RTEMS_RISCV_TOOLCHAIN_IMAGE || '' }}
  RTEMS_ARM_TOOLCHAIN_IMAGE: ${{ inputs.arm_toolchain_image || vars.RTEMS_ARM_TOOLCHAIN_IMAGE || '' }}

# The Erlang/OTP and rebar3 versions used by the setup-beam steps below must
# match OTP_VERSION and REBAR3_VERSION in src/platforms/rtems/docker/dependencies.sh,
# so the local Docker toolchain builds the same BEAM files as CI.

jobs:
  rtems-sparc:
    name: rtems (erc32)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Test pinned source checkouts
      run: bash src/platforms/rtems/tests/test-source-pins.sh

    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29.1.2"
        rebar3-version: "3.27.3"
        hexpm-mirrors: |
          https://builds.hex.pm
          https://repo.hex.pm
          https://cdn.jsdelivr.net/hex

    - name: "apt update"
      run: sudo apt update

    - name: "Install deps"
      run: |
        sudo apt install -y \
          build-essential g++ gdb unzip pax bison flex texinfo \
          python3-dev python-is-python3 python3-setuptools \
          libncurses-dev zlib1g-dev ninja-build pkg-config \
          cmake gperf wget xz-utils python3-pip curl

    - name: Restore RTEMS 6 sparc/erc32 toolchain
      id: rtems-cache
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/rtems/6
        key: rtems-${{ env.RTEMS_RELEASE }}-sparc-erc32-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Build RTEMS 6 tools and sparc/erc32 BSP
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p "$HOME/rtems-src" /home/runner/rtems/6
        cd "$HOME/rtems-src"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems-source-builder.git "${RTEMS_RSB6_COMMIT}" rsb-6
        cd "rsb-6/rtems"
        # SIS runs directly; CI does not need GDB or its GitLab-only patches.
        sed -i '/with_rtems_gdb/d' config/tools/rtems-default-tools.bset
        sed -i 's|https://gmplib.org/download/gmp|https://ftp.gnu.org/gnu/gmp|g' ../source-builder/config/gmp.cfg
        mkdir -p sources
        curl -fSL --retry 3 --retry-all-errors https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.bz2 -o sources/gmp-6.3.0.tar.bz2
        ../source-builder/sb-set-builder --prefix=/home/runner/rtems/6 "6/rtems-sparc"
        ../source-builder/sb-set-builder --prefix=/home/runner/rtems/6 \
          --target="sparc-rtems6" \
          --with-rtems-bsp=sparc/erc32 \
          --with-rtems-tests=no \
          "6/rtems-kernel"
        find /home/runner/rtems/6/bin /home/runner/rtems/6/libexec -type f -executable -exec strip {} + 2>/dev/null || true
        rm -rf "$HOME/rtems-src"

    - name: Save RTEMS 6 sparc/erc32 toolchain
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /home/runner/rtems/6
        key: rtems-${{ env.RTEMS_RELEASE }}-sparc-erc32-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Add RTEMS tools to PATH
      run: echo "/home/runner/rtems/6/bin" >> "$GITHUB_PATH"

    - name: Check RTEMS toolchain
      run: |
        set -euo pipefail
        sparc-rtems6-gcc --version

    - name: Build host AtomVM and RTEMS boot AVM
      run: |
        set -euo pipefail
        cmake -S . -B build-host -G Ninja -DAVM_DISABLE_JIT=ON
        cmake --build build-host -t rtems_boot_test rtems_net_test atomvmlib-rtems
        mkdir -p src/platforms/rtems/build
        ./build-host/tools/packbeam/packbeam create -s test_boot \
          src/platforms/rtems/build/rtems_boot.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_boot.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -s test_net \
          src/platforms/rtems/build/rtems_net.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_net.beam \
          build-host/libs/atomvmlib-rtems.avm

    - name: Cross-compile AtomVM for sparc/erc32
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ env.RTEMS_PREFIX }}" \
          -DRTEMS_BSP=sparc/erc32 \
          -DRTEMS_VERSION="6" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_boot.avm"
        cmake --build src/platforms/rtems/build

    - name: Run boot test on SIS
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build/AtomVM-erc32.exe"
        test -f "$ELF"
        set +e
        output=$(timeout 90 rtems-run --rtems-bsps=erc32-sis "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::RTEMS boot still failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{atomvm_rtems_boot,rtems}' <<< "$output"; then
          echo "::error::RTEMS boot test did not print {atomvm_rtems_boot,rtems} (rtems-run status ${status})"
          exit 1
        fi
        for marker in '{uart,read_timeout,ok}' '{uart,write,ok}' '{i2c,enotsup}' '{gpio,enotsup}'; do
          if ! grep -Fq "$marker" <<< "$output"; then
            echo "::error::RTEMS boot test did not print ${marker}"
            exit 1
          fi
        done
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::RTEMS boot test did not return ok"
          exit 1
        fi
        echo "Boot test output contained {atomvm_rtems_boot,rtems} and Return value: ok"

    - name: Cross-compile AtomVM net test for sparc/erc32
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-net -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ env.RTEMS_PREFIX }}" \
          -DRTEMS_BSP=sparc/erc32 \
          -DRTEMS_VERSION="6" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_net.avm"
        cmake --build src/platforms/rtems/build-net

    - name: Run unsupported-networking test on SIS
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build-net/AtomVM-erc32.exe"
        test -f "$ELF"
        set +e
        output=$(timeout 90 rtems-run --rtems-bsps=erc32-sis "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if ! grep -Fq '{net,enotsup}' <<< "$output"; then
          echo "::error::erc32 net test did not print {net,enotsup} (status ${status})"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::erc32 net test did not return ok"
          exit 1
        fi
        echo "erc32 explicitly reported unsupported networking"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: atomvm-rtems-erc32-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          src/platforms/rtems/build/AtomVM-erc32.exe
          src/platforms/rtems/build-net/AtomVM-erc32.exe

  rtems-arm-toolchain:
    name: rtems-arm (toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Restore ARM RTEMS 6 toolchain
      id: toolchain-cache
      if: env.RTEMS_ARM_TOOLCHAIN_IMAGE == ''
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/rtems/6
        key: rtems-6-arm-toolchain-${{ runner.os }}-v1-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Install build dependencies
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_ARM_TOOLCHAIN_IMAGE == ''
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential g++ gdb unzip pax bison flex texinfo \
          python3-dev python-is-python3 python3-setuptools \
          libncurses-dev zlib1g-dev ninja-build pkg-config \
          cmake gperf wget xz-utils python3-pip curl

    - name: Pull the ARM RTEMS 6 toolchain image
      if: env.RTEMS_ARM_TOOLCHAIN_IMAGE != ''
      run: |
        set -euo pipefail
        echo "Using the toolchain image ${RTEMS_ARM_TOOLCHAIN_IMAGE}"
        docker pull "${RTEMS_ARM_TOOLCHAIN_IMAGE}"
        container="$(docker create "${RTEMS_ARM_TOOLCHAIN_IMAGE}")"
        trap 'docker rm -f "${container}"' EXIT
        mkdir -p /home/runner/rtems/6
        for dir in bin include lib libexec make share; do
          docker cp "${container}:/opt/rtems/6/${dir}" /home/runner/rtems/6/
        done
        # The target headers, libraries and tools live in the multiarch
        # directory; the BSPs next to them are rebuilt by the jobs below.
        mkdir -p /home/runner/rtems/6/arm-rtems6
        for dir in bin include lib; do
          docker cp "${container}:/opt/rtems/6/arm-rtems6/${dir}" /home/runner/rtems/6/arm-rtems6/
        done
        find /home/runner/rtems/6/bin /home/runner/rtems/6/libexec -type f -executable -exec strip {} + 2>/dev/null || true

    - name: Build RSB ARM toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_ARM_TOOLCHAIN_IMAGE == ''
      run: |
        set -euo pipefail
        mkdir -p "$HOME/rtems-src" /home/runner/rtems/6
        cd "$HOME/rtems-src"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems-source-builder.git "${RTEMS_RSB6_COMMIT}" rsb-6
        cd "rsb-6/rtems"
        # QEMU runs directly; CI does not need GDB or its GitLab-only patches.
        sed -i '/with_rtems_gdb/d' config/tools/rtems-default-tools.bset
        sed -i 's|https://gmplib.org/download/gmp|https://ftp.gnu.org/gnu/gmp|g' ../source-builder/config/gmp.cfg
        mkdir -p sources
        curl -fSL --retry 3 --retry-all-errors https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.bz2 -o sources/gmp-6.3.0.tar.bz2
        ../source-builder/sb-set-builder --prefix=/home/runner/rtems/6 "6/rtems-arm"
        find /home/runner/rtems/6/bin /home/runner/rtems/6/libexec -type f -executable -exec strip {} + 2>/dev/null || true
        rm -rf "$HOME/rtems-src"

    - name: Save ARM RTEMS 6 toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_ARM_TOOLCHAIN_IMAGE == ''
      uses: actions/cache/save@v4
      with:
        path: /home/runner/rtems/6
        key: rtems-6-arm-toolchain-${{ runner.os }}-v1-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Verify ARM toolchain
      run: |
        set -euo pipefail
        /home/runner/rtems/6/bin/arm-rtems6-gcc --version

    - name: Archive ARM toolchain
      run: |
        set -euo pipefail
        # Preserve executable permissions and symlinks across artifact transfer.
        tar -C /home/runner/rtems/6 -czf "$RUNNER_TEMP/rtems-6-arm-toolchain.tar.gz" .

    - name: Upload ARM toolchain
      uses: actions/upload-artifact@v4
      with:
        name: rtems-6-arm-toolchain-${{ runner.os }}
        path: ${{ runner.temp }}/rtems-6-arm-toolchain.tar.gz
        if-no-files-found: error
        compression-level: 0
        overwrite: true

  rtems-arm:
    name: rtems (${{ matrix.bsp_name }})
    needs: [rtems-arm-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            bsp: arm/imx7
            bsp_name: imx7
            cache_key: arm-imx7-v3
            rtems_version: "6"
            prefix: /home/runner/rtems/6
            qemu: qemu-system-arm
          - arch: arm
            bsp: arm/realview_pbx_a9_qemu
            bsp_name: realview_pbx_a9_qemu
            cache_key: arm-realview-pbx-a9-qemu-v2
            rtems_version: "6"
            prefix: /home/runner/rtems/6
            qemu: qemu-system-arm

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29.1.2"
        rebar3-version: "3.27.3"
        hexpm-mirrors: |
          https://builds.hex.pm
          https://repo.hex.pm
          https://cdn.jsdelivr.net/hex

    - name: "apt update"
      run: sudo apt update

    - name: "Install deps"
      run: |
        sudo apt install -y \
          build-essential g++ gdb unzip pax bison flex texinfo \
          python3-dev python-is-python3 python3-setuptools \
          libncurses-dev zlib1g-dev ninja-build pkg-config \
          cmake gperf wget xz-utils python3-pip \
          device-tree-compiler u-boot-tools gdb-multiarch \
          ${{ matrix.qemu }}

    - name: Restore RTEMS 6 ${{ matrix.bsp }} toolchain and BSP
      id: rtems-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ matrix.prefix }}
        key: rtems-${{ env.RTEMS_RELEASE }}-${{ matrix.cache_key }}-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Download ARM toolchain
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v4
      with:
        name: rtems-6-arm-toolchain-${{ runner.os }}
        path: ${{ runner.temp }}

    - name: Extract ARM toolchain
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p "${{ matrix.prefix }}"
        tar -C "${{ matrix.prefix }}" -xzf "$RUNNER_TEMP/rtems-6-arm-toolchain.tar.gz"

    - name: Verify ARM toolchain
      run: |
        set -euo pipefail
        if [ ! -x "${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc" ]; then
          echo "::error::ARM toolchain not found at ${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc"
          exit 1
        fi
        "${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc" --version

    - name: Build RTEMS 6 ${{ matrix.bsp }} BSP
      run: |
        set -euo pipefail
        libbsp="${{ matrix.prefix }}/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}/${{ matrix.bsp_name }}/lib/librtemsbsp.a"
        if [ -f "$libbsp" ]; then
          echo "Using cached RTEMS BSP at $libbsp"
          exit 0
        fi
        echo "Building RTEMS 6 BSP for ${{ matrix.bsp }}..."
        mkdir -p "$HOME/rtems-src"
        cd "$HOME/rtems-src"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems-source-builder.git "${RTEMS_RSB6_COMMIT}" rsb-6
        cd "rsb-6/rtems"
        ../source-builder/sb-set-builder --prefix="${{ matrix.prefix }}" \
          --target="${{ matrix.arch }}-rtems${{ matrix.rtems_version }}" \
          --with-rtems-bsp=${{ matrix.bsp }} \
          --with-rtems-smp \
          --with-rtems-tests=no \
          "${{ matrix.rtems_version }}/rtems-kernel"
        rm -rf "$HOME/rtems-src"

    - name: Build rtems-libbsd for ${{ matrix.bsp }}
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        libbsd="${{ matrix.prefix }}/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}/${{ matrix.bsp_name }}/lib/libbsd.a"
        if [ -f "$libbsd" ]; then
          echo "Using cached rtems-libbsd at $libbsd"
          exit 0
        fi
        echo "Building rtems-libbsd with GRiSP 2 Wi-Fi modules"
        mkdir -p "$HOME/rtems-src/libbsd"
        cd "$HOME/rtems-src/libbsd"
        git config --global --add url."https://github.com/RTEMS/rtems_waf".insteadOf "https://gitlab.rtems.org/rtems/tools/rtems-waf" || true
        git config --global --add url."https://github.com/RTEMS/rtems_waf".insteadOf "https://gitlab.rtems.org/rtems/tools/rtems_waf" || true
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems-libbsd.git "${RTEMS_LIBBSD_COMMIT}" rtems-libbsd
        cd "rtems-libbsd"
        git submodule update --init rtems_waf
        python3 -c "
        p = 'rtemsbsd/include/machine/rtems-bsd-libio.h'
        with open(p, 'r+') as f:
            c = f.read()
            f.seek(0)
            f.write('#ifndef LIBIO_FLAGS_CLOSE_BUSY\n#define LIBIO_FLAGS_CLOSE_BUSY 0x0400U\n#endif\n' + c)
        "
        export PATH="${{ matrix.prefix }}/bin:$PATH"
        ./waf configure \
          --prefix="${{ matrix.prefix }}" \
          --rtems-bsps=${{ matrix.bsp }} \
          --buildset="$GITHUB_WORKSPACE/src/platforms/rtems/docker/grisp2-libbsd.ini" \
          --rtems-version="${{ matrix.rtems_version }}"
        ./waf
        ./waf install
        rm -rf "$HOME/rtems-src/libbsd"

    - name: Save RTEMS 6 ${{ matrix.bsp }} toolchain and BSP
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ matrix.prefix }}
        key: rtems-${{ env.RTEMS_RELEASE }}-${{ matrix.cache_key }}-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Add RTEMS tools to PATH
      run: echo "${{ matrix.prefix }}/bin" >> "$GITHUB_PATH"

    - name: Build host AtomVM and RTEMS boot AVM
      run: |
        set -euo pipefail
        cmake -S . -B build-host -G Ninja -DAVM_DISABLE_JIT=ON
        cmake --build build-host -t rtems_boot_test rtems_net_test rtems_grisp2_test rtems_smp_test atomvmlib-rtems
        mkdir -p src/platforms/rtems/build
        ./build-host/tools/packbeam/packbeam create -s test_boot \
          src/platforms/rtems/build/rtems_boot.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_boot.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -s test_smp \
          src/platforms/rtems/build/rtems_smp.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_smp.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -s test_net \
          src/platforms/rtems/build/rtems_net.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_net.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -s test_grisp2 \
          src/platforms/rtems/build/rtems_grisp2.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_grisp2.beam \
          build-host/libs/atomvmlib-rtems.avm

    - name: Test loading replaceable AVM files on the host
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems/tests -B build-rtems-loader -G Ninja \
          -DRTEMS_TEST_PACK="$PWD/src/platforms/rtems/build/rtems_grisp2.avm" \
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        cmake --build build-rtems-loader
        ctest --test-dir build-rtems-loader --output-on-failure
        cmake --build build-host -t test-rtems-startup
        ./build-host/tests/rtems-startup/test-rtems-startup

    - name: Cross-compile and package GRiSP 2 with the imx7 toolchain
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-grisp2 -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP=arm/imx7 \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DRTEMS_BOARD=grisp2 \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_grisp2.avm"
        cmake --build src/platforms/rtems/build-grisp2
        cp src/platforms/rtems/build/rtems_grisp2.avm src/platforms/rtems/build-grisp2/app.avm
        mkimage -l src/platforms/rtems/build-grisp2/AtomVM-grisp2.zImage
        cmp src/platforms/rtems/boards/grisp2/imx6ul-grisp2.dtb \
          src/platforms/rtems/build-grisp2/oftree

    - name: Prepare GRiSP 2 SD-card bundle
      if: matrix.bsp == 'arm/imx7'
      id: sd-card-bundle
      run: |
        set -euo pipefail
        bundle=src/platforms/rtems/build-grisp2/sd-card-bundle
        board=src/platforms/rtems/boards/grisp2
        mkdir -p "$bundle/debug" "$bundle/dtb-source" "$bundle/loader/entries"
        cp src/platforms/rtems/build-grisp2/AtomVM-grisp2.zImage "$bundle/zImage"
        cp src/platforms/rtems/build-grisp2/oftree src/platforms/rtems/build-grisp2/app.avm "$bundle/"
        cp src/platforms/rtems/build-grisp2/AtomVM-grisp2.exe "$bundle/debug/AtomVM-grisp2.elf"
        cp "$board/INSTALL.md" "$bundle/README.md"
        cp "$board/atomvm.conf" "$bundle/loader/entries/atomvm.conf"
        cp "$board/imx6ul-grisp2.dtb.license" "$bundle/oftree.license"
        cp "$board/README.md" "$board/COPYING" "$board/grisp2-dtb-source.tar.gz" \
          "$board/grisp2-dtb-source.tar.gz.license" "$bundle/dtb-source/"
        cp "$board/imx6ul-grisp2.dtb" "$board/imx6ul-grisp2.dtb.license" "$bundle/dtb-source/"
        if [ -f "$board/wpa_supplicant.conf.example" ]; then
          cp "$board/wpa_supplicant.conf.example" "$bundle/"
        fi
        cp -R LICENSES "$bundle/"
        printf 'Source: %s/%s/tree/%s\nBuild: %s/%s/actions/runs/%s\n' \
          "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
          "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$bundle/BUILD.txt"
        echo "name=atomvm-grisp2-sd-card-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

    - name: Upload GRiSP 2 SD-card bundle
      if: matrix.bsp == 'arm/imx7'
      uses: actions/upload-artifact@v4
      with:
        # GitHub adds the .zip extension when downloading the artifact.
        name: ${{ steps.sd-card-bundle.outputs.name }}
        if-no-files-found: error
        path: src/platforms/rtems/build-grisp2/sd-card-bundle/

    - name: Cross-compile AtomVM for ${{ matrix.bsp }}
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_boot.avm"
        cmake --build src/platforms/rtems/build

    - name: Run boot test on QEMU RealView PBX-A9
      if: matrix.bsp == 'arm/realview_pbx_a9_qemu'
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build/AtomVM-realview_pbx_a9_qemu.exe"
        test -f "$ELF"
        export QEMU_AUDIO_DRV="none"
        set +e
        output=$(timeout 90 qemu-system-arm \
          -net none -nographic -no-reboot -M realview-pbx-a9 -m 256M \
          -kernel "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::RealView QEMU boot failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{atomvm_rtems_boot,rtems}' <<< "$output"; then
          echo "::error::RealView QEMU boot did not print {atomvm_rtems_boot,rtems} (status ${status})"
          exit 1
        fi
        for marker in '{uart,read_timeout,ok}' '{uart,write,ok}' '{i2c,enotsup}' '{gpio,enotsup}'; do
          if ! grep -Fq "$marker" <<< "$output"; then
            echo "::error::RealView QEMU boot test did not print ${marker}"
            exit 1
          fi
        done
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::RealView QEMU boot did not return ok"
          exit 1
        fi
        echo "RealView boot test completed successfully"

    - name: Run SMP multi-core test on QEMU RealView PBX-A9
      if: matrix.bsp == 'arm/realview_pbx_a9_qemu'
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-smp -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_smp.avm"
        cmake --build src/platforms/rtems/build-smp
        ELF="src/platforms/rtems/build-smp/AtomVM-realview_pbx_a9_qemu.exe"
        test -f "$ELF"
        export QEMU_AUDIO_DRV="none"
        set +e
        output=$(timeout 90 qemu-system-arm \
          -net none -nographic -no-reboot -M realview-pbx-a9 -m 512M -smp 4 \
          -kernel "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if ! grep -Fq '{smp_parallel_compute,ok}' <<< "$output"; then
          echo "::error::RealView SMP test failed (status ${status})"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::RealView SMP test did not return ok (status ${status})"
          exit 1
        fi
        echo "RealView SMP test completed successfully"

    - name: Cross-compile AtomVM net test for ${{ matrix.bsp }}
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-net -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_net.avm"
        cmake --build src/platforms/rtems/build-net

    - name: Run unsupported-networking test on QEMU RealView PBX-A9
      if: matrix.bsp == 'arm/realview_pbx_a9_qemu'
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build-net/AtomVM-realview_pbx_a9_qemu.exe"
        test -f "$ELF"
        export QEMU_AUDIO_DRV="none"
        set +e
        output=$(timeout 90 qemu-system-arm \
          -net none -nographic -no-reboot -M realview-pbx-a9 -m 256M \
          -kernel "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if ! grep -Fq '{net,enotsup}' <<< "$output"; then
          echo "::error::RealView net test did not print {net,enotsup} (status ${status})"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::RealView net test did not return ok"
          exit 1
        fi
        echo "RealView explicitly reported unsupported networking"

    - name: Fetch and patch imx7d-sdb DTB for QEMU
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        mkdir -p src/platforms/rtems/build /tmp/linux-dts
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        git init -q /tmp/linux-dts
        git -C /tmp/linux-dts remote add origin https://github.com/torvalds/linux.git
        git -C /tmp/linux-dts config remote.origin.promisor true
        git -C /tmp/linux-dts config remote.origin.partialclonefilter blob:none
        git -C /tmp/linux-dts fetch --depth 1 --filter=blob:none origin "${RTEMS_LINUX_DTS_COMMIT}"
        # linux-event-codes.h is a symlink into include/uapi.
        git -C /tmp/linux-dts sparse-checkout set \
          arch/arm/boot/dts include/dt-bindings include/uapi/linux
        git -C /tmp/linux-dts checkout --detach FETCH_HEAD
        cpp -nostdinc -undef -P -x assembler-with-cpp \
          -I /tmp/linux-dts/arch/arm/boot/dts \
          -I /tmp/linux-dts/include \
          /tmp/linux-dts/arch/arm/boot/dts/imx7d-sdb.dts \
          | dtc -@ -I dts -O dtb -o src/platforms/rtems/build/imx7d-sdb-qemu.dtb
        fdtput -t x src/platforms/rtems/build/imx7d-sdb-qemu.dtb /memory@80000000 reg 0x80000000 0x40000000
        fdtput -t x src/platforms/rtems/build/imx7d-sdb-qemu.dtb /timer clock-frequency 0x7a1200

    - name: Run boot test on QEMU mcimx7d-sabre
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build/AtomVM-imx7.exe"
        DTB="src/platforms/rtems/build/imx7d-sdb-qemu.dtb"
        test -f "$ELF"
        test -f "$DTB"
        chmod +x src/platforms/rtems/tools/run-imx7-qemu.sh
        set +e
        output=$(src/platforms/rtems/tools/run-imx7-qemu.sh -d "$DTB" -t 90 "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::imx7 QEMU boot failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{atomvm_rtems_boot,rtems}' <<< "$output"; then
          echo "::error::imx7 QEMU boot did not print {atomvm_rtems_boot,rtems} (status ${status})"
          exit 1
        fi
        for marker in '{uart,read_timeout,ok}' '{uart,write,ok}' '{i2c,open,ok}' '{i2c,fdt_alias,ok}' '{gpio,imx7,ok}'; do
          if ! grep -Fq "$marker" <<< "$output"; then
            echo "::error::imx7 QEMU boot test did not print ${marker}"
            exit 1
          fi
        done
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::imx7 QEMU boot did not return ok"
          exit 1
        fi
        echo "Boot test output contained {atomvm_rtems_boot,rtems} and Return value: ok"

    - name: Run SMP multi-core test on QEMU mcimx7d-sabre
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-smp -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_smp.avm"
        cmake --build src/platforms/rtems/build-smp
        ELF="src/platforms/rtems/build-smp/AtomVM-imx7.exe"
        DTB="src/platforms/rtems/build/imx7d-sdb-qemu.dtb"
        test -f "$ELF"
        test -f "$DTB"
        chmod +x src/platforms/rtems/tools/run-imx7-qemu.sh
        set +e
        output=$(src/platforms/rtems/tools/run-imx7-qemu.sh -d "$DTB" -s 2 -t 90 "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if ! grep -Fq '{smp_parallel_compute,ok}' <<< "$output"; then
          echo "::error::imx7 SMP test failed (status ${status})"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::imx7 SMP test did not return ok (status ${status})"
          exit 1
        fi
        echo "imx7 SMP test completed successfully"

    - name: Run networking tests on QEMU mcimx7d-sabre
      if: matrix.bsp == 'arm/imx7'
      run: |
        set -euo pipefail
        ELF="src/platforms/rtems/build-net/AtomVM-imx7.exe"
        DTB="src/platforms/rtems/build/imx7d-sdb-qemu.dtb"
        test -f "$ELF"
        test -f "$DTB"
        chmod +x src/platforms/rtems/tools/run-imx7-qemu.sh
        chmod +x src/platforms/rtems/tools/probe-hostfwd.py
        python3 src/platforms/rtems/tools/probe-hostfwd.py --timeout 90 --port 8080 &
        probe_pid=$!
        trap 'kill "$probe_pid" 2>/dev/null || true' EXIT
        set +e
        output=$(src/platforms/rtems/tools/run-imx7-qemu.sh \
          -d "$DTB" -t 120 \
          -n "user,model=imx.enet,hostfwd=tcp::8080-:8080" \
          "$ELF" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if kill -0 "$probe_pid" 2>/dev/null; then
          kill "$probe_pid" 2>/dev/null || true
        fi
        set +e
        wait "$probe_pid"
        probe_status=$?
        set -e
        trap - EXIT
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::imx7 QEMU net test failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{dhcp,ok' <<< "$output"; then
          echo "::error::imx7 QEMU net test did not obtain a DHCP address (status ${status})"
          exit 1
        fi
        if ! grep -Fq '{resolver,ok}' <<< "$output"; then
          echo "::error::imx7 QEMU net test did not install resolver configuration"
          exit 1
        fi
        if ! grep -Fq '{dns,ok' <<< "$output"; then
          echo "::error::imx7 QEMU net test did not resolve a DNS name"
          exit 1
        fi
        if ! grep -Fq '{tcp,outbound' <<< "$output"; then
          echo "::error::imx7 QEMU net test did not exercise outbound TCP"
          exit 1
        fi
        if ! grep -Fq '{tcp,echo,ok}' <<< "$output"; then
          echo "::error::imx7 QEMU net test did not run the guest echo server"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::imx7 QEMU net test did not return ok"
          exit 1
        fi
        if [ "$probe_status" -ne 0 ]; then
          echo "::error::host-to-guest probe of forwarded port 8080 failed"
          exit 1
        fi
        echo "Networking smoke test obtained DHCP, DNS, TCP, echo, and hostfwd"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: atomvm-rtems-${{ matrix.bsp_name }}-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          src/platforms/rtems/build/AtomVM-${{ matrix.bsp_name }}.exe
          src/platforms/rtems/build-net/AtomVM-${{ matrix.bsp_name }}.exe
          src/platforms/rtems/build-smp/AtomVM-${{ matrix.bsp_name }}.exe

  rtems-riscv-toolchain:
    name: rtems-riscv (toolchain)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Restore RISC-V RTEMS 7 toolchain
      id: toolchain-cache
      if: env.RTEMS_RISCV_TOOLCHAIN_IMAGE == ''
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/rtems/7
        key: rtems-7-riscv-toolchain-${{ runner.os }}-v2-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Install build dependencies
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_RISCV_TOOLCHAIN_IMAGE == ''
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential g++ gdb unzip pax bison flex texinfo \
          python3-dev python-is-python3 python3-setuptools \
          libncurses-dev zlib1g-dev ninja-build pkg-config \
          cmake gperf wget xz-utils python3-pip curl

    - name: Pull the RISC-V RTEMS 7 toolchain image
      if: env.RTEMS_RISCV_TOOLCHAIN_IMAGE != ''
      run: |
        set -euo pipefail
        echo "Using the toolchain image ${RTEMS_RISCV_TOOLCHAIN_IMAGE}"
        docker pull "${RTEMS_RISCV_TOOLCHAIN_IMAGE}"
        container="$(docker create "${RTEMS_RISCV_TOOLCHAIN_IMAGE}")"
        trap 'docker rm -f "${container}"' EXIT
        mkdir -p /home/runner/rtems/7
        for dir in bin include lib libexec make share; do
          docker cp "${container}:/opt/rtems/7/${dir}" /home/runner/rtems/7/
        done
        # The target headers, libraries and tools live in the multiarch
        # directory; the BSPs next to them are rebuilt by the jobs below.
        mkdir -p /home/runner/rtems/7/riscv-rtems7
        for dir in bin include lib; do
          docker cp "${container}:/opt/rtems/7/riscv-rtems7/${dir}" /home/runner/rtems/7/riscv-rtems7/
        done
        find /home/runner/rtems/7/bin /home/runner/rtems/7/libexec -type f -executable -exec strip {} + 2>/dev/null || true

    - name: Build RSB RISC-V toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_RISCV_TOOLCHAIN_IMAGE == ''
      run: |
        set -euo pipefail
        mkdir -p "$HOME/rtems-src" /home/runner/rtems/7
        cd "$HOME/rtems-src"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems-source-builder.git "${RTEMS_RSB7_COMMIT}" rsb-7
        cd rsb-7/rtems
        sed -i '/sis/d' config/7/rtems-riscv.bset
        sed -i '/with_rtems_gdb/d' config/tools/rtems-default-tools.bset
        sed -i -e '/0001-RTEMS-Add-riscv-multilibs/d' -e '/uCjG1KIhPuCR3H5G/d' config/tools/rtems-gcc-15.2-newlib-head.cfg
        sed -i 's|https://gmplib.org/download/gmp|https://ftp.gnu.org/gnu/gmp|g' ../source-builder/config/gmp.cfg
        mkdir -p sources
        curl -fSL --retry 3 https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.bz2 -o sources/gmp-6.3.0.tar.bz2
        curl -fSL --retry 3 https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.bz2 -o sources/mpfr-4.2.1.tar.bz2
        ../source-builder/sb-set-builder --prefix=/home/runner/rtems/7 "7/rtems-riscv"
        # Strip host debug symbols to save cache bandwidth and storage
        find /home/runner/rtems/7/bin /home/runner/rtems/7/libexec -type f -executable -exec strip {} + 2>/dev/null || true
        rm -rf "$HOME/rtems-src"

    - name: Save RISC-V RTEMS 7 toolchain
      if: steps.toolchain-cache.outputs.cache-hit != 'true' && env.RTEMS_RISCV_TOOLCHAIN_IMAGE == ''
      uses: actions/cache/save@v4
      with:
        path: /home/runner/rtems/7
        key: rtems-7-riscv-toolchain-${{ runner.os }}-v2-${{ hashFiles('src/platforms/rtems/docker/dependencies.sh') }}

    - name: Verify RISC-V toolchain
      run: |
        set -euo pipefail
        /home/runner/rtems/7/bin/riscv-rtems7-gcc --version

    - name: Archive RISC-V toolchain
      run: |
        set -euo pipefail
        # Preserve executable permissions and symlinks across artifact transfer.
        tar -C /home/runner/rtems/7 -czf "$RUNNER_TEMP/rtems-7-riscv-toolchain.tar.gz" .

    - name: Upload RISC-V toolchain
      uses: actions/upload-artifact@v4
      with:
        name: rtems-7-riscv-toolchain-${{ runner.os }}
        path: ${{ runner.temp }}/rtems-7-riscv-toolchain.tar.gz
        if-no-files-found: error
        compression-level: 0
        overwrite: true

  rtems-riscv:
    name: rtems (${{ matrix.bsp_name }})
    needs: [rtems-riscv-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv
            bsp: riscv/esp32c3db
            bsp_name: esp32c3db
            chip: esp32c3
            board: esp32c3
            bsp_config: esp32c3-wifi-bsp.ini
            boot_markers: "{uart,read_timeout,ok} {i2c,fdt_alias,ok} {i2c,open,ok} {gpio,esp32c3,ok} {spi,fdt_alias,ok} {spi,open,ok} {rtc_slow,esp32c3,ok} {crypto,esp32c3,ok}"
            cache_key: riscv-esp32c3db-v4
            rtems_version: "7"
            prefix: /home/runner/rtems/7
          - arch: riscv
            bsp: riscv/esp32c5db
            bsp_name: esp32c5db
            chip: esp32c5
            board: esp32c5
            bsp_config: esp32c5-wifi-bsp.ini
            boot_markers: "{uart,read_timeout,ok} {i2c,fdt_alias,ok} {i2c,open,ok} {gpio,esp32c3,ok} {spi,fdt_alias,ok} {spi,open,ok} {rtc_slow,esp32c3,ok} {crypto,esp32c3,ok}"
            cache_key: riscv-esp32c5db-v3
            rtems_version: "7"
            prefix: /home/runner/rtems/7
          - arch: riscv
            bsp: riscv/esp32c6db
            bsp_name: esp32c6db
            chip: esp32c6
            board: esp32c6
            bsp_config: esp32c6-wifi-bsp.ini
            boot_markers: "{uart,read_timeout,ok} {i2c,fdt_alias,ok} {i2c,open,ok} {gpio,esp32c3,ok} {spi,fdt_alias,ok} {spi,open,ok} {rtc_slow,esp32c3,ok} {crypto,esp32c3,ok}"
            cache_key: riscv-esp32c6db-v3
            rtems_version: "7"
            prefix: /home/runner/rtems/7
          - arch: riscv
            bsp: riscv/esp32s31db
            bsp_name: esp32s31db
            chip: esp32s31
            board: esp32s31
            bsp_config: esp32s31-wifi-bsp.ini
            boot_markers: "{uart,read_timeout,ok} {i2c,fdt_alias,ok} {i2c,open,ok} {gpio,esp32c3,ok} {spi,fdt_alias,ok} {spi,open,ok} {rtc_slow,esp32c3,ok} {crypto,esp32c3,ok}"
            cache_key: riscv-esp32s31db-smp-v3
            rtems_version: "7"
            prefix: /home/runner/rtems/7

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29.1.2"
        rebar3-version: "3.27.3"
        hexpm-mirrors: |
          https://builds.hex.pm
          https://repo.hex.pm
          https://cdn.jsdelivr.net/hex

    - name: "apt update"
      run: sudo apt update

    - name: "Install deps"
      run: |
        sudo apt install -y \
          build-essential g++ gdb unzip pax bison flex texinfo \
          python3-dev python-is-python3 python3-setuptools \
          libncurses-dev zlib1g-dev ninja-build pkg-config \
          cmake gperf wget xz-utils python3-pip curl

    - name: Restore RTEMS 7 ${{ matrix.bsp }} toolchain and BSP
      id: rtems-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ matrix.prefix }}
        key: rtems-7-${{ matrix.cache_key }}-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/**', 'src/platforms/rtems/docker/patches/**') }}

    - name: Download RISC-V toolchain
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      uses: actions/download-artifact@v4
      with:
        name: rtems-7-riscv-toolchain-${{ runner.os }}
        path: ${{ runner.temp }}

    - name: Extract RISC-V toolchain
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        mkdir -p "${{ matrix.prefix }}"
        tar -C "${{ matrix.prefix }}" -xzf "$RUNNER_TEMP/rtems-7-riscv-toolchain.tar.gz"

    - name: Verify RISC-V toolchain
      run: |
        set -euo pipefail
        if [ ! -x "${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc" ]; then
          echo "::error::RISC-V toolchain not found at ${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc"
          exit 1
        fi
        "${{ matrix.prefix }}/bin/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}-gcc" --version

    - name: Build RTEMS 7 ${{ matrix.bsp }} BSP
      run: |
        set -euo pipefail
        libbsp="${{ matrix.prefix }}/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}/${{ matrix.bsp_name }}/lib/librtemsbsp.a"
        if [ -f "$libbsp" ]; then
          echo "Using cached RTEMS BSP at $libbsp"
          exit 0
        fi
        echo "Building RTEMS 7 BSP for ${{ matrix.bsp }}..."
        export PATH="${{ matrix.prefix }}/bin:$PATH"
        mkdir -p "$HOME/rtems-src"
        cd "$HOME/rtems-src"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        rtems_clone_pinned https://github.com/RTEMS/rtems.git "${RTEMS_KERNEL7_COMMIT}" rtems-7
        cd rtems-7
        if [ -d "$GITHUB_WORKSPACE/src/platforms/rtems/docker/patches/rtems" ]; then
          for patch in "$GITHUB_WORKSPACE"/src/platforms/rtems/docker/patches/rtems/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              git apply "$patch" || patch -p1 < "$patch"
            fi
          done
        elif [ -d "$GITHUB_WORKSPACE/src/platforms/rtems/docker/patches" ]; then
          for patch in "$GITHUB_WORKSPACE"/src/platforms/rtems/docker/patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch"
              git apply "$patch" || patch -p1 < "$patch"
            fi
          done
        fi
        ./waf configure --prefix="${{ matrix.prefix }}" --rtems-bsps=${{ matrix.bsp }} \
          --rtems-config="$GITHUB_WORKSPACE/src/platforms/rtems/docker/${{ matrix.bsp_config }}"
        ./waf
        ./waf install
        rm -rf "$HOME/rtems-src"

    - name: Build rtems-lwip and Wi-Fi stack for ${{ matrix.bsp }}
      run: |
        set -euo pipefail
        lwip="${{ matrix.prefix }}/${{ matrix.arch }}-rtems${{ matrix.rtems_version }}/${{ matrix.bsp_name }}/lib/liblwip.a"
        if [ -f "$lwip" ]; then
          echo "Using cached rtems-lwip at $lwip"
          exit 0
        fi
        echo "Building rtems-lwip and Wi-Fi stack for ${{ matrix.chip }}..."
        export PATH="${{ matrix.prefix }}/bin:$PATH"
        "$GITHUB_WORKSPACE/src/platforms/rtems/docker/build-${{ matrix.chip }}-wifi-stack.sh" --prefix="${{ matrix.prefix }}"

    - name: Save RTEMS 7 ${{ matrix.bsp }} toolchain and BSP
      if: steps.rtems-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ matrix.prefix }}
        key: rtems-7-${{ matrix.cache_key }}-wifi-${{ runner.os }}-${{ hashFiles('src/platforms/rtems/docker/**', 'src/platforms/rtems/docker/patches/**') }}

    - name: Add RTEMS tools to PATH
      run: echo "${{ matrix.prefix }}/bin" >> "$GITHUB_PATH"

    - name: Build host AtomVM and RTEMS boot AVM
      run: |
        set -euo pipefail
        cmake -S . -B build-host -G Ninja -DAVM_DISABLE_JIT=ON
        cmake --build build-host -t rtems_boot_test rtems_net_test rtems_grisp2_test rtems_smp_test rtems_peripheral_test atomvmlib-rtems rtems_${{ matrix.chip }}_wifi_test
        mkdir -p src/platforms/rtems/build
        ./build-host/tools/packbeam/packbeam create -p -r -s test_boot \
          src/platforms/rtems/build/rtems_boot.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_boot.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -p -r -s test_smp \
          src/platforms/rtems/build/rtems_smp.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_smp.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -p -r -s test_net \
          src/platforms/rtems/build/rtems_net.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_net.beam \
          build-host/libs/atomvmlib-rtems.avm
        ./build-host/tools/packbeam/packbeam create -p -r -s test_${{ matrix.chip }}_wifi \
          src/platforms/rtems/build/rtems_${{ matrix.chip }}_wifi.avm \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_${{ matrix.chip }}_wifi.beam \
          build-host/libs/atomvmlib-rtems.avm

    - name: Cross-compile AtomVM for ${{ matrix.bsp }}
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DRTEMS_BOARD=${{ matrix.board }} \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_boot.avm"
        cmake --build src/platforms/rtems/build

    - name: Run boot test on esp-emulator
      env:
        BOOT_MARKERS: ${{ matrix.boot_markers }}
      run: |
        set -euo pipefail
        BIN="src/platforms/rtems/build/AtomVM-${{ matrix.bsp_name }}.bin"
        test -f "$BIN"
        . "$GITHUB_WORKSPACE/src/platforms/rtems/docker/dependencies.sh"
        curl -fsSL "https://raw.githubusercontent.com/espressif/esp-emulator/${ESP_EMU_INSTALL_COMMIT}/install.sh" \
          -o "$RUNNER_TEMP/esp-emu-install.sh"
        sh "$RUNNER_TEMP/esp-emu-install.sh" --version "${RTEMS_ESP_EMU_VERSION}"
        export PATH="$HOME/.local/bin:$PATH"
        emu_opts=(--timeout 30s)
        if [ "${{ matrix.chip }}" = "esp32s31" ]; then
          emu_opts=(--batch-size 50000 --timeout 90s)
        fi
        output=$(esp-emu --chip ${{ matrix.chip }} "${emu_opts[@]}" --firmware "$BIN" --exit-on "Return value: ok" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::${{ matrix.chip }} boot failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{atomvm_rtems_boot,rtems}' <<< "$output"; then
          echo "::error::${{ matrix.chip }} boot test did not print {atomvm_rtems_boot,rtems} (status ${status})"
          exit 1
        fi
        read -r -a boot_markers <<< "$BOOT_MARKERS"
        for marker in "${boot_markers[@]}"; do
          if ! grep -Fq "$marker" <<< "$output"; then
            echo "::error::${{ matrix.chip }} boot test did not print ${marker}"
            exit 1
          fi
        done
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::${{ matrix.chip }} boot test did not return ok"
          exit 1
        fi
        echo "${{ matrix.chip }} boot test completed successfully"

    - name: Test peripherals and RTEMS sleep integration
      run: |
        set -euo pipefail
        ./build-host/tools/packbeam/packbeam create -p -r -s test_peripherals \
          "$RUNNER_TEMP/rtems_peripherals.avm" \
          build-host/src/platforms/rtems/tests/test_erl_sources/test_peripherals.beam \
          build-host/libs/atomvmlib-rtems.avm
        # The pinned emulator does not model the newer RTC timers or power
        # transitions. Replace those two hardware entry points for this test;
        # the boot test above builds and runs the normal hardware backend.
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-peripherals -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DRTEMS_BOARD=${{ matrix.board }} \
          -DRTEMS_SLEEP_TEST_FIXTURE=ON \
          -DAVM_PACK="$RUNNER_TEMP/rtems_peripherals.avm"
        cmake --build src/platforms/rtems/build-peripherals
        export PATH="$HOME/.local/bin:$PATH"
        output=$(esp-emu --chip ${{ matrix.chip }} --batch-size 50000 \
          --firmware "src/platforms/rtems/build-peripherals/AtomVM-${{ matrix.bsp_name }}.bin" \
          --timeout 90s --exit-on "Return value: ok" 2>&1)
        printf '%s\n' "$output"
        grep -Fq 'Return value: ok' <<< "$output"

    - name: Cross-compile AtomVM Wi-Fi and HTTP test for ${{ matrix.chip }}
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-wifi -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DRTEMS_BOARD=${{ matrix.board }} \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_${{ matrix.chip }}_wifi.avm"
        cmake --build src/platforms/rtems/build-wifi

    - name: Run Wi-Fi and HTTP test on esp-emulator
      run: |
        set -euo pipefail
        BIN="src/platforms/rtems/build-wifi/AtomVM-${{ matrix.bsp_name }}.bin"
        test -f "$BIN"
        export PATH="$HOME/.local/bin:$PATH"
        python3 -m http.server 8080 --directory "$GITHUB_WORKSPACE" >/dev/null 2>&1 &
        HTTP_PID=$!
        python3 src/platforms/rtems/tools/mock_sntp_server.py 12300 >/dev/null 2>&1 &
        SNTP_PID=$!
        trap 'kill "$HTTP_PID" "$SNTP_PID" 2>/dev/null || true' EXIT
        set +e
        # C3 needs shorter emulator batches to avoid authentication timeouts.
        output=$(esp-emu --chip ${{ matrix.chip }} \
          --firmware "$BIN" \
          --wifi-ssid "AtomVM-TestAP" --wifi-password "secretpassword" --net user \
          --batch-size ${{ matrix.chip == 'esp32c3' && 1000 || 5000 }} --timeout 60s --exit-on "Return value: ok" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if grep -q "Failed load module" <<< "$output"; then
          echo "::error::${{ matrix.chip }} Wi-Fi test failed to load a BEAM module"
          exit 1
        fi
        if ! grep -Fq '{atomvm_${{ matrix.chip }}_wifi,rtems}' <<< "$output"; then
          echo "::error::${{ matrix.chip }} Wi-Fi test did not print {atomvm_${{ matrix.chip }}_wifi,rtems} (status ${status})"
          exit 1
        fi
        for marker in '{wifi_scan,active_and_passive,ok}' '{wifi_scan,callback_and_cancel,ok}' '{wifi_start,ok}' '{wifi_status,got_ip}' '{ifaddrs_match,ok}' '{socket_open,ok}' '{socket_close,ok}' '{udp_echo,ok}' '{tcp_echo,ok}' '{gen_tcp_passive,ok}' '{socket_select,ok}' '{dns_numeric_match,ok}' '{dns_inet_getaddr,ok}' '{set_clock,ok}' '{clock_set_year_valid,ok}' '{network_sntp_start,ok}' '{sntp_smoke_done,ok}' '{wifi_test_complete,ok}'; do
          if ! grep -Fq "$marker" <<< "$output"; then
            echo "::error::${{ matrix.chip }} Wi-Fi test did not print ${marker}"
            exit 1
          fi
        done
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::${{ matrix.chip }} Wi-Fi test did not return ok"
          exit 1
        fi
        echo "${{ matrix.chip }} Wi-Fi network and SNTP test suite completed successfully"

    - name: Run SMP multi-core test on esp-emulator
      if: matrix.chip == 'esp32s31'
      run: |
        set -euo pipefail
        cmake -S src/platforms/rtems -B src/platforms/rtems/build-smp -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE=cmake/rtems-toolchain.cmake \
          -DRTEMS_PREFIX="${{ matrix.prefix }}" \
          -DRTEMS_BSP="${{ matrix.bsp }}" \
          -DRTEMS_VERSION="${{ matrix.rtems_version }}" \
          -DRTEMS_BOARD=${{ matrix.board }} \
          -DAVM_PACK="$PWD/src/platforms/rtems/build/rtems_smp.avm"
        cmake --build src/platforms/rtems/build-smp
        BIN="src/platforms/rtems/build-smp/AtomVM-${{ matrix.bsp_name }}.bin"
        test -f "$BIN"
        export PATH="$HOME/.local/bin:$PATH"
        set +e
        output=$(esp-emu --chip esp32s31 --batch-size 50000 --firmware "$BIN" --timeout 90s --exit-on "Return value: ok" 2>&1)
        status=$?
        set -e
        printf '%s\n' "$output"
        if ! grep -Fq '{smp_parallel_compute,ok}' <<< "$output"; then
          echo "::error::esp32s31 SMP test failed (status ${status})"
          exit 1
        fi
        if ! grep -q "Return value: ok" <<< "$output"; then
          echo "::error::esp32s31 SMP test did not return ok (status ${status})"
          exit 1
        fi
        echo "esp32s31 SMP test completed successfully"

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: atomvm-rtems-${{ matrix.bsp_name }}-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          src/platforms/rtems/build/AtomVM-${{ matrix.bsp_name }}.bin
          src/platforms/rtems/build-wifi/AtomVM-${{ matrix.bsp_name }}.bin
          src/platforms/rtems/build-smp/AtomVM-${{ matrix.bsp_name }}.bin
