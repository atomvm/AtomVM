# riscv/esp32h2db BSP configuration for AtomVM.
#
# 0x4000 = 16 KiB reserved for code executing from SRAM (.fast_text), which the
# H2 needs none of today -- there is no Wi-Fi stack to place there -- but which
# a Bluetooth controller would, and which costs little of 320 KiB.
#
# 0x12000 = 72 KiB at the top of the 320 KiB SRAM belongs to the ROM: its shared
# download-mode buffers from 0x4083ba78, its stack, and its data and BSS.  ESP-IDF
# stops the application at 0x4083efd0; this reserves a little more.
#
# 0x100000 = 1 MiB of flash code space for the direct-boot image. Read-only
# data follows the code region, so the firmware ends below 2 MiB and fits the
# 2 MiB flash of ESP32-H2-DevKitM-1 boards; the H2 code itself is under 600 KiB.
[riscv/esp32h2db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = False
ESP32C_IRAM_REGION_SIZE = 0x4000
ESP32C_DRAM_ROM_RESERVE_SIZE = 0x12000
ESP32C_CODE_REGION_SIZE = 0x100000
