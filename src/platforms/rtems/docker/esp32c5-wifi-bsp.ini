# riscv/esp32c5db BSP configuration for AtomVM with Wi-Fi support.
#
# 0x14000 = 80 KiB reserved for code executing from SRAM (.wifi*iram sections),
# which now also carries the BLE controller's fast advertising and connection
# paths (.adv_fast_execute_code_iram1 / .high_perf_code_iram1).  Wi-Fi alone
# needs about 53 KiB and the BLE paths add about 25 KiB.  The rest of the
# unified 384 KiB SRAM stays available for DRAM heap and lwIP packet pools.
# The top 16 KiB covers the ROM's fixed data and its temporary boot stack.
#
# 0x300000 = 3.0 MiB of flash code space for direct-boot image.
[riscv/esp32c5db]
BUILD_TESTS = False
ESPRESSIF_USE_USB_CONSOLE = False
ESP32C_IRAM_REGION_SIZE = 0x14000
ESP32C_DRAM_ROM_RESERVE_SIZE = 0x4000
ESP32C_CODE_REGION_SIZE = 0x300000
