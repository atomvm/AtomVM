# riscv/esp32p4db BSP configuration for AtomVM.
#
# 0x14000 = 80 KiB reserved for code executing from SRAM (.wifi*iram sections),
# leaving the rest of the unified 768 KiB SRAM for DRAM heap.
#
# 0x6000 covers the ROM's fixed data and its temporary boot stack at the top of
# SRAM.
#
# 0x300000 = 3.0 MiB of flash code space for the direct-boot image.
[riscv/esp32p4db]
BUILD_TESTS = False
RTEMS_SMP = True
ESPRESSIF_USE_USB_CONSOLE = False
ESP32C_IRAM_REGION_SIZE = 0x14000
ESP32C_DRAM_ROM_RESERVE_SIZE = 0x6000
ESP32C_CODE_REGION_SIZE = 0x300000

# Revision 1.x has ROM data/stack at the top of the low 256 KiB bank.
# Use only that bank, leaving 24 KiB to ROM, and leave the high SRAM/cache
# partition to the ROM. No Wi-Fi blobs need the v3 target's 80 KiB IRAM.
[riscv/esp32p4v1db]
BUILD_TESTS = False
RTEMS_SMP = True
ESPRESSIF_USE_USB_CONSOLE = False
ESP32C_IRAM_REGION_SIZE = 0x1000
ESP32C_DRAM_ROM_RESERVE_SIZE = 0x6000
ESP32C_CODE_REGION_SIZE = 0x300000
