CONFIG_KERNEL_BIN_NAME="AtomVM"
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_SYS_HEAP_AUTO=y
CONFIG_GPIO=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_STACK_USAGE=y
CONFIG_RUNTIME_ERROR_CHECKS=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
CONFIG_FORTIFY_SOURCE_RUN_TIME=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_TARGET=y

# Power management and task watchdog APIs are part of the standard Zephyr
# platform surface. The custom policy remains idle unless an application
# explicitly forces a state through the Zephyr API.
CONFIG_PM=y
CONFIG_PM_POLICY_CUSTOM=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=n

# AtomVM relies on GNU-style constructors for registration/initialization
CONFIG_STATIC_INIT_GNU=y

# POSIX API is required globally for standard POSIX functions and native_sim builds
CONFIG_POSIX_API=y




