CONFIG_KERNEL_BIN_NAME="AtomVM"
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
CONFIG_SYS_HEAP_AUTO=y
CONFIG_GPIO=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REBOOT=y
CONFIG_STACK_USAGE=y
CONFIG_RUNTIME_ERROR_CHECKS=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
CONFIG_FORTIFY_SOURCE_RUN_TIME=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONNECTION_MANAGER=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_EVENTFD=y
CONFIG_ZVFS_EVENTFD_MAX=2
CONFIG_STATIC_INIT_GNU=y
