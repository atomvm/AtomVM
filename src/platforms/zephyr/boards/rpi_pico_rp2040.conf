# Raspberry Pi Pico (RP2040) non-W board fragment.
#
# The RP2040 has two Arm Cortex-M0+ cores, but Zephyr does not yet wire up SMP
# for ARMv6-M (see zephyr#59826), so AtomVM runs single-core on this board.
#
# The plain Pico has no networking hardware, so the networking/Wi-Fi options
# forced on by the base prj.conf are explicitly unset here. Gating out
# CONFIG_NET_SOCKETS / CONFIG_WIFI also drops the otp_socket/inet/otp_net and
# network_driver sources, which are compiled conditionally in src/lib.
#
# Zephyr exposes this as the qualified rpi_pico/rp2040 board. The Pico W
# variant uses rpi_pico/rp2040/w and has its own rpi_pico_rp2040_w.conf
# fragment.

# No networking hardware on the plain Pico.
# CONFIG_NETWORKING is not set
# CONFIG_NET_L2_ETHERNET is not set
# CONFIG_NET_IPV4 is not set
# CONFIG_NET_DHCPV4 is not set
# CONFIG_DNS_RESOLVER is not set
# CONFIG_NET_TCP is not set
# CONFIG_NET_UDP is not set
# CONFIG_NET_SOCKETS is not set
# CONFIG_POSIX_API is not set
# CONFIG_NET_CONNECTION_MANAGER is not set
# CONFIG_WIFI is not set
# CONFIG_NET_L2_WIFI_MGMT is not set
# CONFIG_NET_MGMT is not set
# CONFIG_NET_MGMT_EVENT is not set
# CONFIG_NET_MGMT_EVENT_INFO is not set
# CONFIG_EVENTFD is not set
# CONFIG_ZVFS_EVENTFD_MAX is not set
