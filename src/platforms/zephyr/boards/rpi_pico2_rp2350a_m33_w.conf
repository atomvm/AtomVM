# Raspberry Pi Pico 2 W (RP2350A Cortex-M33) board fragment.
#
# Zephyr exposes this as the qualified rpi_pico2/rp2350a/m33/w board.
# Explicitly select the CYW43439 module used by the Pico W family.
CONFIG_AVM_ENABLE_WIFI=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y

# The networking stack needs sys_rand_get(); keep this explicit for the Wi-Fi
# target so the build does not depend on board entropy defaults.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
