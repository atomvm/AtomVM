# Raspberry Pi Pico W (RP2040) board fragment.
#
# Zephyr exposes this as the qualified rpi_pico/rp2040/w board. Explicitly
# select the CYW43439 module used by the Pico W.
CONFIG_AVM_ENABLE_WIFI=y
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y

# The networking stack needs sys_rand_get(); RP2040 does not expose a hardware
# entropy source through Zephyr, so use Zephyr's timer-backed build-time
# provider for this Wi-Fi target.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_PWM=y
