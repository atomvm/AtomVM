# qemu_x86_64 enables CONFIG_SMP and CONFIG_MP_MAX_NUM_CPUS=2 in Zephyr's
# board defconfig. Keep the SMP settings explicit here so this board remains
# the Zephyr target that exercises AtomVM's experimental SMP path.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2

# The Zephyr SMP shim uses kernel threads and custom thread data to distinguish
# secondary scheduler threads from the main scheduler. qemu_x86_64 uses two
# CPUs, so one pre-allocated dynamic stack is enough for the secondary
# scheduler thread.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_STACK_SIZE=16384
CONFIG_DYNAMIC_THREAD_POOL_SIZE=1
CONFIG_THREAD_CUSTOM_DATA=y

# Keep the QEMU boot test self-contained. The generic Zephyr prj.conf enables
# networking, which makes this board's runner expect an external SLIP socket.
CONFIG_NETWORKING=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_MGMT_EVENT_INFO=n
