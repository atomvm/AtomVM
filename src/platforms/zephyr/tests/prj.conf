CONFIG_ZTEST=y
CONFIG_KERNEL_BIN_NAME="zephyr"
# Disable clock calibration on ESP32 to prevent simulator hangs
CONFIG_CLOCK_CONTROL_ESP32_RTC_CLK_CAL_CYCLES=0

# AtomVM allocates with malloc(). Use Zephyr's common libc malloc and let the
# arena claim all remaining SRAM (-1). Fixed dual heaps forced every MCU to
# carry QEMU-sized static BSS and required per-board overrides on ESP/Pico.
# HEAP_MEM_POOL_SIZE stays at the Kconfig default (0); subsystems that need
# k_malloc (e.g. DYNAMIC_THREAD_ALLOC on QEMU) raise the minimum themselves.
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1
