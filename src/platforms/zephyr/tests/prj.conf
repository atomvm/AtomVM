CONFIG_ZTEST=y
CONFIG_KERNEL_BIN_NAME="zephyr"
# Disable clock calibration on ESP32 to prevent simulator hangs
CONFIG_CLOCK_CONTROL_ESP32_RTC_CLK_CAL_CYCLES=0

CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

# Crypto support (for test_md5, test_crypto)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_HASH_ALL_ENABLED=y
CONFIG_MBEDTLS_CIPHER_ALL_ENABLED=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_PSA_WANT_ALG_CFB=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y

# POSIX socketpair support
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_MAX_CONN=4
CONFIG_NET_UDP=y
CONFIG_SLIP=n
CONFIG_NET_TEST=y
CONFIG_MBEDTLS_CTR_DRBG_C=y

# SMP support (for test_time_and_processes)
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
