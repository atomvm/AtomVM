tests:
  atomvm.zephyr.boot_smp:
    tags:
      - atomvm
      - zephyr
      - qemu
    platform_allow:
      - qemu_x86_64
    integration_platforms:
      - qemu_x86_64
    harness: console
    harness_config:
      type: one_line
      regex:
        - "Zephyr boot test: SMP schedulers=2 online=2"
    timeout: 20
  atomvm.zephyr.build_esp32:
    tags:
      - atomvm
      - zephyr
      - esp32
    platform_allow:
      - esp32_devkitc/esp32/procpu
      - esp32s3_devkitc/esp32s3/procpu
      - esp32c3_devkitm/esp32c3
    integration_platforms:
      - esp32_devkitc/esp32/procpu
    build_only: true
