CONFIG_EMUL=y
CONFIG_KERNEL_BIN_NAME="zephyr"
CONFIG_STDOUT_CONSOLE=n
CONFIG_SYS_HEAP_AUTO=n

# Keep the native_sim I2C test self-contained. The generic Zephyr prj.conf
# enables networking, which is not needed for this emulator-backed test.
CONFIG_NETWORKING=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_MGMT_EVENT_INFO=n
