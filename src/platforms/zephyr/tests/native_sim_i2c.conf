CONFIG_EMUL=y
CONFIG_KERNEL_BIN_NAME="zephyr"
CONFIG_STDOUT_CONSOLE=n
CONFIG_SYS_HEAP_AUTO=n

# Native simulator links against the host C library by default. Floating-point
# cbprintf pulls host libm objects that do not survive native_sim's final link.
CONFIG_CBPRINTF_FP_SUPPORT=n


