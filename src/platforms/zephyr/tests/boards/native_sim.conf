# Enable emulator subsystem on native_sim to support emulator-backed I2C controllers
CONFIG_EMUL=y
CONFIG_SPI=y
CONFIG_PWM=y

# Settings/NVS on the board's simulated flash storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
