# ESP32-S3 has 512 KiB of SRAM. Shared test defaults (~124 KiB heap pool +
# ~124 KiB libc arena) overflow dram0_0_seg with Wi-Fi and the portable
# peripheral stack (~27 KiB). About ~222 KiB remains for static heaps; max
# that out (160 KiB pool + rest to libc malloc).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=163840
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=62976

CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
