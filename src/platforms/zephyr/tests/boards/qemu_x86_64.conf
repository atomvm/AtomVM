# POSIX socketpair support for test_select. Keep this scoped to QEMU so
# embedded test builds do not pull in extra networking state just for this test.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETPAIR=y
CONFIG_NET_MAX_CONN=4
CONFIG_NET_UDP=y
CONFIG_SLIP=n
CONFIG_NET_TEST=y

# SMP support for test_time_and_processes.
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y

# Keep the libc arena within qemu_x86_64's 8 MiB kernel virtual address
# space. Automatic sizing leaves insufficient room for the kernel and image.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=4194304
# Dynamic thread stacks use k_malloc (system heap), not the auto-sized
# libc malloc arena. Keep a modest fixed pool for QEMU only.
CONFIG_HEAP_MEM_POOL_SIZE=65536
