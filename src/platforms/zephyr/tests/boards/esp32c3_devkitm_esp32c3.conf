# ESP32-C3 has 400 KiB of SRAM. Shared test defaults (~124 KiB heap pool +
# ~124 KiB libc arena) overflow dram0_0_seg once Wi-Fi and the portable
# peripheral stack are linked (~59 KiB). About ~190 KiB remains for static
# heaps; max that out (128 KiB pool + rest to libc malloc).
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=63488

CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
