# The rpi_pico/rp2040 has 264 KiB of SRAM.
# Reduce heap memory pool and libc malloc arena sizes to avoid RAM region overflow.
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
