# Heap/malloc sizing is automatic via tests/prj.conf
# (CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1).
# The ztest thread runs the AtomVM interpreter and Mbed TLS. The 1 KiB
# default is too small on RP2040 and corrupts adjacent kernel state.
CONFIG_ZTEST_STACK_SIZE=16384
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_MAP_LABELS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Wokwi's RP2040 SSI model only implements the flash reads needed by the
# bootloader, not flash programming. NVS-backed settings therefore cannot
# persist in the simulator; native_sim, QEMU, and ESP32 cover Settings/NVS.
# CONFIG_SETTINGS is not set
# CONFIG_SETTINGS_NVS is not set
# CONFIG_NVS is not set
