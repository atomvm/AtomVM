# The ESP32 Wokwi test image exercises Wi-Fi scan support, but still keeps
# heavyweight socket paths out of this embedded test build.
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_NET_SOCKETS_SERVICE=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=3072
CONFIG_POSIX_API=y
CONFIG_POSIX_SYSTEM_INTERFACES=y
CONFIG_POSIX_TIMERS=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="10.13.37.1"
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_MAX_CONN=4
CONFIG_NET_CONNECTION_MANAGER=n

# The test AVM has a narrower workload than the full ESP32 app, and the full
# 128 KiB libc arena does not fit alongside PSA crypto and Wi-Fi scan support
# in internal RAM.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=49152
