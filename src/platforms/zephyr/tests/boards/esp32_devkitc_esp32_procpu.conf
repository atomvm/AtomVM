# The ESP32 Wokwi test image exercises Wi-Fi scan support, but still keeps
# heavyweight socket paths out of this embedded test build.
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_MAX_CONN=6
CONFIG_NET_CONNECTION_MANAGER=n

# Reduce network packet and buffer counts to save static DRAM
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16

# Only keep the two main ECDSA ciphersuites
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y

# PSA settings (these were the ones that got us furthest)
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=n
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=n
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=n

CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y

# Configure MbedTLS payload buffers for the Wokwi HTTPS client test. This
# Zephyr SDK exposes the deprecated symmetric setting, so both RX and TX use it.
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192

# The test AVM has a narrower workload than the full ESP32 app, and the full
# 128 KiB libc arena does not fit alongside PSA crypto and Wi-Fi scan support
# in internal RAM. Keep the Wokwi test main stack smaller than the application
# default to give MbedTLS more libc malloc room.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_HEAP_MEM_POOL_SIZE=140000
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=61376
