# Keep the ESP32 Wokwi test image focused on the embedded Erlang tests. The
# generic Zephyr app config enables networking and Wi-Fi for the platform app,
# but these tests do not exercise them and the extra pools can overflow IRAM.
CONFIG_NETWORKING=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_IPV4=n
CONFIG_NET_DHCPV4=n
CONFIG_DNS_RESOLVER=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=n
CONFIG_NET_SOCKETS=n
CONFIG_NET_CONNECTION_MANAGER=n
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI_MGMT=n
CONFIG_NET_MGMT=n
CONFIG_NET_MGMT_EVENT=n
CONFIG_NET_MGMT_EVENT_INFO=n

# The test AVM has a narrower workload than the full ESP32 app, and the full
# 128 KiB libc arena does not fit alongside PSA crypto in internal RAM.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=65536
