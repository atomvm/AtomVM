# The ztest thread runs the AtomVM interpreter and Mbed TLS. The 1 KiB
# default is too small on RP2350 and corrupts adjacent kernel state.
CONFIG_ZTEST_STACK_SIZE=16384

# Zephyr 4.5's generic timer asserts that the timeout lock is held. On this
# uniprocessor Pico 2 build the assertion fires on the first timeout even
# though the kernel is inside K_SPINLOCK. Disable kernel __ASSERT for the
# Wokwi image; ztest assertions remain enabled.
CONFIG_ASSERT=n

# Pico 2 has PM support but no devicetree CPU power states, so the generic
# test_deep_sleep_hold case cannot force standby or soft-off. PM coverage
# remains in the ESP32 Wokwi targets.
# CONFIG_PM is not set
