<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
  </head>
  <body>
    <pre id="result">N/A</pre>
    <script type="module">
    import AtomVM from "/AtomVM.mjs";

    // A value the hook tracks under a key it allocated itself, rather than
    // letting trackValue allocate one.
    class TrackedValue {
        constructor({ key, value }) {
            if (typeof key !== "number") {
                throw new Error("key property in TrackedValue must be a number");
            }
            this.key = key;
            this.value = value;
        }
    }
    globalThis.TrackedValue = TrackedValue;

    // Arguments are loaded using fetch API.
    // wasm_webserver serves under /tests/build/ files in src/platform/escripten/build/tests/src subdirectory
    // and under /build/ files in build/ subdirectory.
    // A JIT build has no interpreter, so it needs the bundle carrying the
    // wasm32 backend rather than the individual libraries. The flavor travels
    // in the fragment because wasm_webserver would take a query string as part
    // of the file name to serve.
    const jit = window.location.hash === "#jit";
    const libraries = jit
        ? ['/build/libs/atomvmlib-emscripten-wasm32.avm']
        : ['/build/libs/eavmlib/src/eavmlib.avm', '/build/libs/avm_emscripten/src/avm_emscripten.avm', '/build/libs/estdlib/src/estdlib.avm'];
    const module = await AtomVM({
        arguments: ['/tests/build/test_tracked_hook_overrides.beam', ...libraries]
    });
    window.Module = module;

    // Everything below runs synchronously: an await here would let the browser
    // drain a proxied tracked call while the defaults are still in place.
    module.serialize = JSON.stringify;
    module.deserialize = JSON.parse;
    module.cleanupFunctions = new Map();

    // Values are not strings, so they are serialized on the way out. An
    // unserializable one makes JSON.stringify throw: a contract violation.
    module.onGetTrackedObjects = (keys) =>
        keys.map((key) => module.serialize(module.trackedObjectsMap.get(key)));

    // Deleting a key runs the closure registered for it first, which is how
    // an embedder unregisters what the tracked value was holding on to.
    module.onTrackedObjectDelete = (key) => {
        const cleanup = module.cleanupFunctions.get(key);
        module.cleanupFunctions.delete(key);
        try {
            cleanup && cleanup();
        } finally {
            module.trackedObjectsMap.delete(key);
        }
    };

    // The script is a function taking the module rather than an array
    // expression, so the hook evaluates it and then calls it.
    module.onRunTrackedJs = (scriptString, isDebug) => {
        const trackValue = (tracked) => {
            if (tracked instanceof TrackedValue) {
                module.trackedObjectsMap.set(tracked.key, tracked.value);
                return tracked.key;
            }
            const key = module.nextTrackedObjectKey();
            module.trackedObjectsMap.set(key, tracked);
            return key;
        };

        let scriptFunction;
        try {
            const indirectEval = eval;
            scriptFunction = indirectEval(scriptString);
        } catch (e) {
            isDebug && console.error("onRunTrackedJs: evaluating the script threw", e);
            return null;
        }
        let result;
        try {
            result = scriptFunction(module);
        } catch (e) {
            isDebug && console.error("onRunTrackedJs: calling the script threw", e);
            return null;
        }
        if (result === null || result === undefined) {
            return [];
        }
        if (!Array.isArray(result)) {
            isDebug && console.error("onRunTrackedJs: script returned a non-array", result);
            return null;
        }
        return Array.from(result, trackValue);
    };
    </script>
  </body>
</html>
